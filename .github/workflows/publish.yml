# Publishes the TerraFluent.Pdf.Reporting NuGet package to nuget.org.
#
# Triggered automatically when a GitHub Release is published.
# The release tag MUST follow semantic versioning with a "v" prefix (e.g. v1.2.0)
# and MUST match the <Version> in src/TerraFluent.Pdf.Reporting/TerraFluent.Pdf.Reporting.csproj.
#
# Authentication: NuGet.org Trusted Publishing (OIDC) — no long-lived API key.
# The NuGet/login action exchanges this workflow's GitHub OIDC token for a
# short-lived nuget.org API key, so no NUGET_API_KEY secret is stored.
#
# One-time setup:
#   1. On nuget.org: your account -> Trusted Publishing -> Add
#      - Repository owner : sahebansari
#      - Repository       : TerraFluent.Pdf.Reporting
#      - Workflow file    : publish.yml
#   2. On GitHub: Settings -> Secrets and variables -> Actions -> Secrets
#      - Add repository secret NUGET_USER = your nuget.org username
#        (the account/organization that owns the trusted publishing policy)
#   3. Verify the setup: Actions -> Publish NuGet -> Run workflow
#      - Runs the auth-test job only: performs the OIDC login against
#        nuget.org and stops. Nothing is packed or published.
#
# How to release (full checklist):
#   1. Bump <Version> in src/TerraFluent.Pdf.Reporting/TerraFluent.Pdf.Reporting.csproj        (e.g. 1.2.0)
#   2. Update CHANGELOG.md - move [Unreleased] items to [1.2.0] section
#   3. Commit everything and push to main
#   4. On GitHub: Releases -> Draft a new release
#      - Set tag to match the version, e.g.  v1.2.0
#      - Copy the CHANGELOG section as release notes
#      - Click "Publish release"
#   => This workflow runs automatically and pushes .nupkg + .snupkg to nuget.org

name: Publish NuGet

on:
  release:
    types: [ published ]
  # Manual trigger: runs ONLY the auth-test job below — verifies the
  # Trusted Publishing setup end-to-end without packing or pushing anything.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # required to mint the OIDC token for NuGet Trusted Publishing

jobs:
  # Dry-run authentication check (Actions -> Publish NuGet -> Run workflow).
  # Exchanges this workflow's OIDC token for a temporary nuget.org API key via
  # the Trusted Publishing policy — the exact same exchange the publish job
  # performs — then discards it. Succeeds only if the policy on nuget.org and
  # the NUGET_USER repository variable are both configured correctly.
  auth-test:
    name: Test nuget.org authentication
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Confirm
        run: echo "Trusted Publishing authentication succeeded — temporary API key issued (and discarded)."

  publish:
    name: Pack & Push
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0       # full history required for source-link

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x
            10.x

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

      # Ensure the Git tag (e.g. v1.2.0) matches <Version> in the .csproj (e.g. 1.2.0).
      # Prevents accidentally publishing the wrong version.
      - name: Verify tag matches csproj version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CSPROJ_VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/TerraFluent.Pdf.Reporting/TerraFluent.Pdf.Reporting.csproj | tr -d '[:space:]')
          echo "Git tag version : $TAG_VERSION"
          echo "csproj version  : $CSPROJ_VERSION"
          if [ "$TAG_VERSION" != "$CSPROJ_VERSION" ]; then
            echo "::error::Release tag ($TAG_VERSION) does not match <Version> in TerraFluent.Pdf.Reporting.csproj ($CSPROJ_VERSION). Update the csproj before releasing."
            exit 1
          fi

      - name: Pack
        run: |
          dotnet pack src/TerraFluent.Pdf.Reporting/TerraFluent.Pdf.Reporting.csproj \
            --no-build \
            -c Release \
            -o ./artifacts

      # Make the .nupkg and .snupkg downloadable from the Actions run page
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ github.ref_name }}
          path: ./artifacts/

      # Exchange the workflow's GitHub OIDC token for a short-lived nuget.org
      # API key via the Trusted Publishing policy configured on nuget.org.
      - name: NuGet login (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push .nupkg to nuget.org
        run: |
          dotnet nuget push ./artifacts/*.nupkg \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Push .snupkg symbols to nuget.org
        run: |
          dotnet nuget push ./artifacts/*.snupkg \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
